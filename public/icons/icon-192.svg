<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFDF9"/>
      <stop offset="100%" stop-color="#F4EFE6"/>
    </radialGradient>
  </defs>
  <!-- Background Disc -->
  <rect width="512" height="512" rx="128" fill="#FBF8F2"/>
  <circle cx="256" cy="256" r="210" fill="url(#bgGlow)" stroke="#E5DAC9" stroke-width="2"/>
  
  <!-- Subtle Mala Ring of 108 micro beads -->
  <circle cx="256" cy="256" r="170" fill="none" stroke="#DE9644" stroke-width="1.5" stroke-dasharray="2 7.8" opacity="0.6"/>
  <circle cx="256" cy="256" r="190" fill="none" stroke="#C5A059" stroke-width="1" stroke-dasharray="1 11" opacity="0.4"/>
  
  <!-- Sumeru Top Accent -->
  <circle cx="256" cy="84" r="8" fill="#C85A17"/>
  <circle cx="256" cy="84" r="14" fill="none" stroke="#C85A17" stroke-width="1.5" opacity="0.4"/>
  
  <!-- Central Sacred Om Symbol -->
  <text x="256" y="295" font-family="'Noto Serif Devanagari', 'Georgia', serif" font-size="140" font-weight="600" fill="#C85A17" text-anchor="middle" dominant-baseline="middle">🕉</text>
  
  <!-- Subtle Tagline -->
  <text x="256" y="380" font-family="'Noto Serif Devanagari', serif" font-size="18" font-weight="500" fill="#782E13" text-anchor="middle" letter-spacing="3" opacity="0.8">माला जप</text>
</svg>
